<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FutPro – Carreira</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f4;--card:#fff;--tx:#0f1f17;--mu:#5b6b62;--ac:#0a9f4f;--ac2:#f5a623;--bd:#d9e2dc;--bad:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1410;--card:#13211a;--tx:#e8f2ec;--mu:#8fa398;--ac:#2ee67a;--ac2:#ffc247;--bd:#223529;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0b1410;--card:#13211a;--tx:#e8f2ec;--mu:#8fa398;--ac:#2ee67a;--ac2:#ffc247;--bd:#223529;--bad:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:repeating-linear-gradient(90deg,transparent 0 60px,rgba(46,230,122,.035) 60px 120px)}
header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ac),#066b34);display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0}h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:#04210f;border-color:var(--ac)}
main{padding:14px 12px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--ac);color:#04210f;border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 10px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer}
.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(95px,1fr))}
.st{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:22px;color:var(--ac)}.st span{font-size:11px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.cd{display:flex;gap:8px;justify-content:center;margin:8px 0}
.cd div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:64px;text-align:center}
.cd b{font-size:26px;display:block;color:var(--ac2)}.cd span{font-size:11px;color:var(--mu)}
.bar{position:relative;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;opacity:.9}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-top:3px}
.pitch{height:120px;border-radius:12px;border:2px solid var(--ac);position:relative;background:repeating-linear-gradient(90deg,rgba(46,230,122,.08) 0 30px,transparent 30px 60px);margin-bottom:10px}
.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ac)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;border:2px solid var(--ac);border-radius:50%;transform:translate(-50%,-50%)}
.muted{color:var(--mu);font-size:13px}
.ok{color:var(--ac)}.warn{color:var(--ac2)}
ul{padding-left:18px;margin:6px 0}
</style>
</head>
<body>
<header><div class="logo">⚽</div><h1 id="ttl">FutPro<small>Carreira · Rotina · Plano</small></h1></header>
<nav id="nav"></nav>
<main id="v"></main>
<script>
var TABS=[["perfil","Perfil"],["carreira","Carreira"],["jogos","Jogos"],["zona","Zona"],["rotina","Rotina"],["plano","Plano"]];
var S={perfil:{nome:"",pos:"",pe:"",idade:"",clube:""},clubes:[],jogos:[],zona:[],rotina:[],cfg:{jogoMax:120,acorda:"06:00",dorme:"22:00"}};
var tab="perfil",tm=null;
try{var r=localStorage.getItem("futpro");if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function sv(){try{localStorage.setItem("futpro",JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function t2m(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function m2t(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function f1(n){return (Math.round(n*100)/100).toFixed(2)}
function fd(s){var d=new Date(s);return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}
function nav(){$("nav").innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")}
function go(t){tab=t;nav();draw();window.scrollTo(0,0)}
function del(k,id){S[k]=S[k].filter(function(x){return x.id!=id});sv();draw()}
function val(i){var e=$(i);return e?e.value:""}

/* estatísticas */
function stats(l){var p=l.filter(function(j){return j.jogado}),o={j:p.length,min:0,g:0,a:0,n:0,nn:0};
 p.forEach(function(j){o.min+=+j.min||0;o.g+=+j.gols||0;o.a+=+j.ass||0;if(j.nota){o.n+=+j.nota;o.nn++}});
 o.ga=o.g+o.a;o.gpj=o.j?o.g/o.j:0;o.apj=o.j?o.a/o.j:0;o.gapj=o.j?o.ga/o.j:0;o.nota=o.nn?o.n/o.nn:0;o.g90=o.min?o.g*90/o.min:0;return o}
function stHtml(o){var c=[["Jogos",o.j],["Minutos",o.min],["Golos",o.g],["Assist.",o.a],["G+A",o.ga],["Golos/jogo",f1(o.gpj)],["Assist./jogo",f1(o.apj)],["G/A por jogo",f1(o.gapj)],["Golos/90'",f1(o.g90)],["Nota média",o.nn?f1(o.nota):"–"]];
 return '<div class="stats">'+c.map(function(x){return '<div class="st"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("")+'</div>'}

/* views */
function draw(){clearInterval(tm);var f={perfil:vPerfil,carreira:vCarreira,jogos:vJogos,zona:vZona,rotina:vRotina,plano:vPlano}[tab];$("v").innerHTML=f();if(tab=="jogos")tick()}
function vPerfil(){var p=S.perfil,all=stats(S.jogos);
 return '<div class="card"><h2>O teu perfil</h2><div class="pitch"></div><div class="grid"><div><label>Nome</label><input id="pn" value="'+esc(p.nome)+'"></div><div><label>Posição</label><select id="pp">'+["","Guarda-redes","Defesa central","Lateral","Médio defensivo","Médio","Extremo","Avançado"].map(function(x){return '<option'+(p.pos==x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div><div><label>Pé preferido</label><select id="pe">'+["","Direito","Esquerdo","Ambos"].map(function(x){return '<option'+(p.pe==x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div><div><label>Idade</label><input id="pi" type="number" value="'+esc(p.idade)+'"></div></div><button class="b" onclick="svPerfil()">Guardar perfil</button></div>'+
 '<div class="card"><h2>Carreira profissional (clubes reais)</h2>'+stHtml(all)+'</div>'+
 '<div class="card"><h2>Cópia de segurança</h2><button class="g" onclick="exp()">Exportar dados (JSON)</button> <button class="g" onclick="imp()">Importar</button><p class="muted">Os dados ficam guardados neste navegador.</p></div>'}
function svPerfil(){S.perfil={nome:val("pn"),pos:val("pp"),pe:val("pe"),idade:val("pi"),clube:S.perfil.clube};sv();$("ttl").firstChild.nodeValue=S.perfil.nome?S.perfil.nome:"FutPro";alert("Perfil guardado")}
function exp(){var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="futpro.json";a.click()}
function imp(){var t=prompt("Cola aqui o JSON exportado:");if(!t)return;try{S=Object.assign(S,JSON.parse(t));sv();draw()}catch(e){alert("JSON inválido")}}

function vCarreira(){
 var h='<div class="card"><h2>Adicionar clube</h2><div class="grid"><div><label>País</label><input id="cp" placeholder="Moçambique"></div><div><label>Clube</label><input id="cn"></div><div><label>Liga / divisão</label><input id="cl"></div><div><label>Camisola nº</label><input id="cj" type="number"></div></div><button class="b" onclick="addClube()">Adicionar clube</button><p class="muted">Clubes com poucos dados públicos (ex.: Moçambique): o calendário é preenchido por ti na aba Jogos.</p></div>';
 h+='<div class="card"><h2>Os teus clubes</h2>';
 if(!S.clubes.length)h+='<p class="muted">Ainda sem clubes.</p>';
 S.clubes.forEach(function(c){var s=stats(S.jogos.filter(function(j){return j.club==c.id}));
  h+='<div class="row"><div><b>'+esc(c.nome)+'</b> <span class="tag">'+esc(c.pais)+'</span> <span class="tag">'+esc(c.liga||"liga n/d")+'</span><br><span class="muted">'+(c.plantel?"No plantel · nº "+esc(c.num||"–"):"Fora do plantel")+' · '+s.j+' jogos · '+s.g+' G · '+s.a+' A</span></div><div><button class="g" onclick="plantel(\''+c.id+'\')">'+(c.plantel?"Sair":"Entrar no plantel")+'</button> <button class="g" onclick="sel(\''+c.id+'\')">'+(S.perfil.clube==c.id?"✓ Atual":"Selecionar")+'</button> <button class="g" onclick="del(\'clubes\',\''+c.id+'\')">✕</button></div></div>'});
 return h+'</div>'}
function addClube(){var n=val("cn").trim();if(!n)return;S.clubes.push({id:uid(),pais:val("cp"),nome:n,liga:val("cl"),num:val("cj"),plantel:false});sv();draw()}
function plantel(id){S.clubes.forEach(function(c){if(c.id==id)c.plantel=!c.plantel});sv();draw()}
function sel(id){S.perfil.clube=id;sv();draw()}
function cur(){return S.clubes.filter(function(c){return c.id==S.perfil.clube})[0]}

function gForm(p,extra){return '<div class="grid"><div><label>Data e hora</label><input id="'+p+'d" type="datetime-local"></div><div><label>Adversário</label><input id="'+p+'a"></div><div><label>Competição</label><input id="'+p+'c"></div>'+extra+'</div>'}
function gStats(p){return '<div class="grid" style="margin-top:8px"><div><label>Resultado (ex. 2-1)</label><input id="'+p+'r"></div><div><label>Minutos</label><input id="'+p+'m" type="number" max="130"></div><div><label>Golos</label><input id="'+p+'g" type="number"></div><div><label>Assistências</label><input id="'+p+'s" type="number"></div><div><label>Nota (0-10)</label><input id="'+p+'n" type="number" step="0.1" max="10"></div></div>'}
function vJogos(){var c=cur();if(!c)return '<div class="card"><p>Seleciona um clube na aba Carreira.</p></div>';
 var l=S.jogos.filter(function(j){return j.club==c.id}).sort(function(a,b){return new Date(a.data)-new Date(b.data)}),nx=l.filter(function(j){return !j.jogado&&new Date(j.data)>new Date()})[0];
 var h='<div class="card"><h2>'+esc(c.nome)+' · Próximo jogo</h2>'+(nx?'<p style="margin:0">vs <b>'+esc(nx.adv)+'</b> '+(nx.casa?"(casa)":"(fora)")+' · '+fd(nx.data)+'</p><div class="cd" id="cd"></div><div id="prep"></div>':'<p class="muted">Sem jogos futuros. Adiciona abaixo.</p>')+'</div>';
 h+='<div class="card"><h2>Estatísticas no clube</h2>'+stHtml(stats(l))+'</div>';
 h+='<div class="card"><h2>Adicionar jogo ao calendário</h2>'+gForm("j",'<div><label>Local</label><select id="jh"><option value="1">Casa</option><option value="0">Fora</option></select></div><div><label>Posição neste jogo</label><select id="jp"><option value="">Posição principal</option>'+POSS.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select></div>')+'<button class="b" onclick="addJogo()">Adicionar jogo</button></div>';
 h+='<div class="card"><h2>Calendário e resultados</h2>';
 l.forEach(function(j){h+='<div class="row"><div><b>'+esc(j.adv)+'</b> <span class="tag">'+esc(j.comp||"jogo")+'</span> <span class="tag">'+(j.casa?"Casa":"Fora")+'</span><br><span class="muted">'+fd(j.data)+(j.jogado?' · '+esc(j.res||"–")+' · '+(j.min||0)+"' · "+(j.gols||0)+'G '+(j.ass||0)+'A · nota '+(j.nota||"–"):'')+'</span></div><div><button class="g" onclick="edJogo(\''+j.id+'\')">'+(j.jogado?"Editar":"Registar")+'</button> <button class="g" onclick="del(\'jogos\',\''+j.id+'\')">✕</button></div></div>'});
 return h+(l.length?'':'<p class="muted">Sem jogos.</p>')+'<div id="ed"></div></div>'}
function addJogo(){var c=cur();if(!val("jd")||!val("ja").trim())return;S.jogos.push({id:uid(),club:c.id,data:val("jd"),adv:val("ja"),comp:val("jc"),casa:val("jh")=="1",posJ:val("jp"),jogado:false});sv();draw()}
function edJogo(id){var j=S.jogos.filter(function(x){return x.id==id})[0];$("ed").innerHTML='<hr><h2>Registar desempenho: '+esc(j.adv)+'</h2>'+gStats("e")+'<button class="b" onclick="svJogo(\''+id+'\')">Guardar</button>';
 ["r:res","m:min","g:gols","s:ass","n:nota"].forEach(function(x){var p=x.split(":");$("e"+p[0]).value=j[p[1]]||""})}
function svJogo(id){S.jogos.forEach(function(j){if(j.id==id){j.res=val("er");j.min=+val("em")||0;j.gols=+val("eg")||0;j.ass=+val("es")||0;j.nota=+val("en")||0;j.jogado=true}});sv();draw()}
function tick(){var c=cur();if(!c)return;var nx=S.jogos.filter(function(j){return j.club==c.id&&!j.jogado&&new Date(j.data)>new Date()}).sort(function(a,b){return new Date(a.data)-new Date(b.data)})[0];if(!nx)return;
 function u(){var d=new Date(nx.data)-new Date();if(d<0){draw();return}var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60,e=$("cd");if(!e)return;
  e.innerHTML=[[dd,"dias"],[hh,"horas"],[mm,"min"],[ss,"seg"]].map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("");
  var H=d/3600000,t=H>48?["Treino normal; sono de 8 h","Hidratação constante"]:H>24?["Carga reduzida; carboidratos nas refeições","Análise do adversário","Preparar equipamento"]:H>3?["Sono de 8 a 9 h","Hidratar: 2 L até ao jogo","Visualização tática 15 min"]:["Refeição leve concluída","Aquecimento dinâmico 20 min","Foco e respiração 5 min"];
  $("prep").innerHTML='<b class="warn">Preparação agora</b><ul>'+t.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'}
 u();tm=setInterval(u,1000)}

function vZona(){var s=stats(S.zona),h='<div class="card"><h2>Jogos da zona (não contam para o profissional)</h2>'+stHtml(s)+'</div><div class="card"><h2>Adicionar jogo da zona</h2>'+gForm("z",'<div><label>Local</label><input id="zl"></div>')+gStats("z2")+'<button class="b" onclick="addZona()">Guardar</button></div><div class="card"><h2>Histórico</h2>';
 S.zona.slice().sort(function(a,b){return new Date(b.data)-new Date(a.data)}).forEach(function(j){h+='<div class="row"><div><b>'+esc(j.adv)+'</b> <span class="tag">zona</span><br><span class="muted">'+fd(j.data)+' · '+esc(j.res||"–")+' · '+j.min+"' · "+j.gols+'G '+j.ass+'A · nota '+(j.nota||"–")+'</span></div><button class="g" onclick="del(\'zona\',\''+j.id+'\')">✕</button></div>'});
 return h+(S.zona.length?'':'<p class="muted">Sem jogos.</p>')+'</div>'}
function addZona(){if(!val("zd"))return;S.zona.push({id:uid(),data:val("zd"),adv:val("za")||"Zona",comp:val("zc"),res:val("z2r"),min:+val("z2m")||0,gols:+val("z2g")||0,ass:+val("z2s")||0,nota:+val("z2n")||0,jogado:true});sv();draw()}

/* rotina: deteção automática */
var CAT=[["sono",/dorm|sono|deit|acord|levant/i,"#6c63ff"],["banho",/banho|duche|ducha/i,"#2db7f5"],["treino",/treino|gin[aá]sio|corrida|gym|cardio|for[cç]a|t[eé]cnic/i,"#2ee67a"],["alimentação",/comer|almo[cç]o|jantar|pequeno|lanche|refei|caf[eé]/i,"#f5a623"],["jogos",/jogo|fifa|ps\d|consola|playstation|videojogo|efootball/i,"#e056fd"],["estudo",/estud|aula|escola|instituto|trabalho/i,"#ff7675"],["recuperação",/descans|alongam|recuper|massag|gelo|sesta/i,"#00cec9"]];
function cls(n){for(var i=0;i<CAT.length;i++)if(CAT[i][1].test(n))return{c:CAT[i][0],k:CAT[i][2]};return{c:"outro",k:"#8fa398"}}
function banhoTipo(n){return /gelad/i.test(n)?"gelado (10 a 15 °C, 2 a 3 min)":/frio|fria/i.test(n)?"frio (15 a 20 °C, 3 a 5 min)":/quente/i.test(n)?"quente (36 a 38 °C, 5 a 8 min)":""}
function segs(r){var a=t2m(r.ini),b=t2m(r.fim);return b>a?[[a,b]]:[[a,1440],[0,b]]}
function busy(){var o=[];S.rotina.forEach(function(r){segs(r).forEach(function(s){o.push(s)})});return o.sort(function(a,b){return a[0]-b[0]})}
function free(){var o=busy(),f=[],c=0;o.forEach(function(s){if(s[0]>c)f.push([c,s[0]]);c=Math.max(c,s[1])});if(c<1440)f.push([c,1440]);return f}
function vRotina(){var h='<div class="card"><h2>Adicionar atividade</h2><div class="grid"><div><label>O que fazes</label><input id="ra" placeholder="dormir, banho gelado, treino…"></div><div><label>Início</label><input id="ri" type="time" value="06:00"></div><div><label>Fim</label><input id="rf" type="time" value="07:00"></div></div><button class="b" onclick="addRot()">Adicionar</button><p class="muted">A atividade é reconhecida pelo nome e o horário é classificado como ocupado.</p></div>';
 h+='<div class="card"><h2>Linha do dia (24 h)</h2><div class="bar">'+S.rotina.map(function(r){var k=cls(r.nome).k;return segs(r).map(function(s){return '<i style="left:'+s[0]/14.4+'%;width:'+(s[1]-s[0])/14.4+'%;background:'+k+'"></i>'}).join("")}).join("")+'</div><div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';
 var fr=free();h+='<p><b class="ok">Livre:</b> '+(fr.length?fr.map(function(f){return m2t(f[0])+" – "+(f[1]==1440?"24:00":m2t(f[1]))}).join(" · "):"nenhum")+'</p></div><div class="card"><h2>Atividades</h2>';
 S.rotina.slice().sort(function(a,b){return t2m(a.ini)-t2m(b.ini)}).forEach(function(r){var c=cls(r.nome),bt=c.c=="banho"?banhoTipo(r.nome):"";h+='<div class="row"><div><b>'+esc(r.nome)+'</b> <span class="tag" style="border-color:'+c.k+'">'+c.c+'</span><br><span class="muted">'+r.ini+' – '+r.fim+(bt?" · banho "+bt:"")+'</span></div><button class="g" onclick="del(\'rotina\',\''+r.id+'\')">✕</button></div>'});
 return h+(S.rotina.length?'':'<p class="muted">Sem atividades.</p>')+'</div>'}
function addRot(){var n=val("ra").trim();if(!n)return;var a=val("ri"),b=val("rf");if(a==b)return;var nr={id:uid(),nome:n,ini:a,fim:b},ov=false;busy().forEach(function(s){segs(nr).forEach(function(q){if(q[0]<s[1]&&q[1]>s[0])ov=true})});
 if(ov&&!confirm("Esse horário colide com outra atividade. Adicionar mesmo assim?"))return;S.rotina.push(nr);sv();draw()}

/* plano automático */

 return `<div class='card'><h2>Conselho de hoje · ${DN[dsem(new Date())]}</h2><p>${dicaDia()}</p></div>`+
 `<div class='card'><h2>Dribles de ${esc(p.pos)}</h2><p class='muted'>${driZona(p.pos)}</p>${ids.map(driHtml).join('')}</div>`+
 `<div class='card'><h2>Como escolher o drible certo</h2><ol><li>Onde está o espaço atrás do defesa?</li><li>Qual é o pé de apoio e para onde está o peso dele?</li><li>Quantos colegas cobrem se perderes a bola? Se forem 0 e estás no teu meio-campo, passa.</li></ol><p class='muted'>Faz 2 olhares por cima do ombro antes de receber a bola.</p></div>`+
 `<div class='card'><h2>Outros dribles</h2>${DRI.map(function(d,i){return ids.indexOf(i)<0?driHtml(i):''}).join('')}</div>`}

function proxJ(){return S.jogos.filter(function(j){return !j.jogado&&new Date(j.data)>new Date()}).sort(function(a,b){return new Date(a.data)-new Date(b.data)})[0]}
function resp(q){q=q.toLowerCase();var p=S.perfil,s=stats(S.jogos.concat(S.zona)),id=+p.idade||0;
 if(p.doente&&/trein|plano|dribl/.test(q))return 'Estás doente desde '+p.doenteDesde+': repouso total até te recuperares.';
 if(/dribl|finta/.test(q))return p.pos?dicaDia():'Escolhe primeiro a posição no Perfil.';
 if(/jogo|partida/.test(q)){var j=proxJ();if(!j)return 'Não há jogos futuros registados.';var h=(new Date(j.data)-new Date())/36e5;return 'Próximo jogo: '+j.adv+' em '+Math.floor(h/24)+' d '+Math.round(h%24)+' h.'}
 if(/meta|peneira/.test(q)){var m=proxMeta();if(!m)return 'Não há metas futuras.';var d=(new Date(m.data)-new Date())/864e5;return m.nome+' em '+Math.floor(d)+' dias. Fase: '+fase(d)+'.'}
 if(/golo|assist|nota|estat/.test(q))return s.j?'Jogos '+s.j+', golos '+s.g+', assistências '+s.a+', G/A por jogo '+f1(s.gapj)+', nota média '+(s.nn?f1(s.nota):'sem nota')+'.':'Ainda não registaste jogos.';
 if(/sono|dorm/.test(q))return 'Precisas de '+(id&&id<=13?10:id&&id<=17?9:8)+' h de sono por noite.';
 if(/comer|aliment|fome/.test(q))return 'Faz 4 refeições por dia. Os valores exatos estão na aba Plano.';
 if(/trein|plano/.test(q))return 'O plano está na aba Plano. Em Ajustar o plano mudas os dias e a carga.';
 return 'Pergunta-me sobre dribles, próximo jogo, metas, estatísticas, sono, alimentação ou plano.'}
function vCon(){S.chat=S.chat||[];S.conv=S.conv||[];
 var h=`<div class='card'><h2>Treinador virtual</h2><div id='ch' style='max-height:300px;overflow:auto'>${S.chat.map(function(m){var u=m[0]=='u';return `<div style='margin:6px 0;text-align:${u?'right':'left'}'><span style='display:inline-block;max-width:85%;padding:8px 10px;border-radius:12px;text-align:left;${u?'background:var(--ac);color:#04210f':'background:var(--bg);border:1px solid var(--bd)'}'>${esc(m[1])}</span></div>`}).join('')}</div><div style='display:flex;gap:8px;margin-top:8px'><input id='cq' placeholder='Dribles, próximo jogo, sono…' onkeydown='if(event.key=="Enter")cEnv()'><button class='b' style='margin:0' onclick='cEnv()'>Enviar</button></div><p class='muted'>As respostas usam os teus dados, sem internet.</p></div>`+
 `<div class='card'><h2>Conversas com outros e comigo</h2><div class='grid'>${Sx('Com quem','cw',['Comigo','Treinador','Colega','Empresário','Família','Outro'],'')}${I('Nome (opcional)','cn2','')}</div><label style='margin-top:8px'>O que foi falado ou aprendido</label><input id='ct' placeholder='Ex.: treinador pediu mais remates de primeira'><button class='b' onclick='cSav()'>Guardar conversa</button>`+
 S.conv.slice().reverse().map(function(c){return `<div class='row'><div><span class='tag'>${esc(c.w)}${c.n?' · '+esc(c.n):''}</span> <span class='muted'>${c.d}</span><br>${esc(c.t)}</div><button class='g' onclick="del('conv','${c.id}')">✕</button></div>`}).join('')+(S.conv.length?'':`<p class='muted'>Sem conversas guardadas.</p>`)+`</div>`;return h}
function cEnv(){var q=val('cq').trim();if(!q)return;S.chat.push(['u',q]);S.chat.push(['b',resp(q)]);S.chat=S.chat.slice(-30);sv();draw();var c=$('ch');if(c)c.scrollTop=c.scrollHeight}
function cSav(){var t=val('ct').trim();if(!t)return;S.conv.push({id:uid(),w:val('cw'),n:val('cn2'),d:new Date().toLocaleDateString('pt-PT'),t:t});sv();draw()}

var draw0=draw;draw=function(){if(tab=='dri'||tab=='con'){clearInterval(tm);$('v').innerHTML=(tab=='dri'?vDri:vCon)()}else draw0()};
var ixp=TABS.map(function(x){return x[0]}).indexOf('plano');TABS.splice(ixp<0?TABS.length:ixp,0,['dri','Dribles'],['con','Conversas']);
nav();draw();
nav();draw();if(S.perfil.nome)$("ttl").firstChild.nodeValue=S.perfil.nome;
</script>
</body>
